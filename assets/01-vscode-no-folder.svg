<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="ui-sans-serif, 'Segoe UI', system-ui, sans-serif">
  <title>Visual Studio Code with no folder open</title>
  <desc>The VS Code window before any folder is opened. The Explorer sidebar offers an Open Folder button and a Clone Repository button; the Welcome tab offers the same commands as a list.</desc>

  <rect x="0" y="0" width="900" height="560" rx="10" fill="#0b0b0b"/>

  <!-- window -->
  <rect x="14" y="14" width="872" height="452" rx="8" fill="#1f1f1f" stroke="#3a3a3a"/>
  <rect x="14" y="14" width="872" height="32" rx="8" fill="#181818"/>
  <rect x="14" y="36" width="872" height="10" fill="#181818"/>
  <text x="450" y="35" font-size="12" fill="#9d9d9d" text-anchor="middle">Visual Studio Code</text>
  <g stroke="#8a8a8a" stroke-width="1.2" fill="none">
    <path d="M844 30 h10"/>
    <rect x="860" y="25" width="9" height="9"/>
    <path d="M875 25 l9 9 M884 25 l-9 9"/>
  </g>
  <line x1="14" y1="46" x2="886" y2="46" stroke="#2b2b2b"/>

  <!-- activity bar -->
  <rect x="14" y="46" width="48" height="388" fill="#181818"/>
  <line x1="62" y1="46" x2="62" y2="434" stroke="#2b2b2b"/>
  <rect x="14" y="60" width="2" height="28" fill="#e0e0e0"/>
  <g stroke="#e0e0e0" stroke-width="1.4" fill="none">
    <path d="M30 66 h12 l6 6 v14 h-18 z"/>
  </g>
  <g stroke="#7d7d7d" stroke-width="1.4" fill="none">
    <circle cx="35" cy="110" r="6"/><path d="M40 115 l6 6"/>
    <circle cx="31" cy="148" r="4"/><circle cx="43" cy="140" r="4"/><circle cx="43" cy="160" r="4"/>
    <path d="M31 152 v4 q0 4 6 4 h2"/><path d="M43 144 v12"/>
    <path d="M30 186 l14 8 -14 8 z"/>
    <rect x="29" y="228" width="9" height="9"/><rect x="41" y="228" width="9" height="9"/><rect x="29" y="240" width="9" height="9"/>
  </g>

  <!-- explorer sidebar -->
  <rect x="62" y="46" width="240" height="388" fill="#181818"/>
  <text x="78" y="70" font-size="11" fill="#bbbbbb" letter-spacing="1.2">EXPLORER</text>
  <text x="78" y="112" font-size="12.5" fill="#9d9d9d">You have not yet opened a folder.</text>
  <rect x="78" y="132" width="208" height="30" rx="4" fill="#0078d4"/>
  <text x="182" y="152" font-size="12.5" fill="#ffffff" text-anchor="middle">Open Folder</text>
  <text x="78" y="192" font-size="12.5" fill="#9d9d9d">You can clone a repository locally.</text>
  <rect x="78" y="204" width="208" height="30" rx="4" fill="#313131" stroke="#3c3c3c"/>
  <text x="182" y="224" font-size="12.5" fill="#cccccc" text-anchor="middle">Clone Repository</text>

  <!-- editor -->
  <rect x="302" y="46" width="584" height="34" fill="#181818"/>
  <rect x="302" y="46" width="112" height="34" fill="#1f1f1f"/>
  <rect x="302" y="46" width="112" height="2" fill="#0078d4"/>
  <text x="318" y="68" font-size="12" fill="#cccccc">Welcome</text>
  <line x1="302" y1="80" x2="886" y2="80" stroke="#2b2b2b"/>
  <text x="346" y="150" font-size="24" fill="#6a6a6a">Visual Studio Code</text>
  <text x="346" y="174" font-size="13" fill="#5a5a5a">Editing evolved</text>
  <text x="346" y="222" font-size="13" fill="#bdbdbd" font-weight="600">Start</text>
  <text x="346" y="250" font-size="13" fill="#4daafc">New File...</text>
  <text x="346" y="276" font-size="13" fill="#4daafc">Open Folder...</text>
  <text x="346" y="302" font-size="13" fill="#4daafc">Clone Git Repository...</text>
  <text x="346" y="352" font-size="13" fill="#bdbdbd" font-weight="600">Recent</text>
  <text x="346" y="378" font-size="13" fill="#6a6a6a">You have no recent folders.</text>

  <!-- status bar -->
  <rect x="14" y="434" width="872" height="32" fill="#181818"/>
  <rect x="14" y="456" width="872" height="10" fill="#181818"/>
  <line x1="14" y1="434" x2="886" y2="434" stroke="#2b2b2b"/>
  <text x="34" y="454" font-size="11.5" fill="#9d9d9d">No folder opened</text>

  <!-- callouts -->
  <circle cx="300" cy="219" r="13" fill="#f0a500"/>
  <text x="300" y="224" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text>
  <circle cx="524" cy="297" r="13" fill="#f0a500"/>
  <text x="524" y="302" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- legend -->
  <text x="16" y="500" font-size="13.5" fill="#e6e6e6"><tspan fill="#f0a500" font-weight="700">1</tspan>  Clone Repository. VS Code downloads the course repository for you and then offers to open it —</text>
  <text x="16" y="521" font-size="13.5" fill="#e6e6e6">    no terminal, no git command to remember. The Welcome tab has the same command; either door works.</text>
  <text x="16" y="545" font-size="12.5" fill="#8f8f8f">Nothing is open yet, so the assistant has no course material to read. That is what step 3 fixes.</text>
</svg>
