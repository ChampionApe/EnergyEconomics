<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif, 'Segoe UI', system-ui, sans-serif">
  <title>Turning off inline completions</title>
  <desc>The bottom of the VS Code window. Clicking the Copilot icon in the status bar opens a menu whose Disable Completions entry switches off the grey ghost text while leaving chat working.</desc>

  <rect x="0" y="0" width="900" height="470" rx="10" fill="#0b0b0b"/>
  <text x="16" y="26" font-size="12" fill="#6a6a6a">bottom of the VS Code window</text>

  <rect x="14" y="36" width="872" height="260" rx="8" fill="#1f1f1f" stroke="#3a3a3a"/>
  <rect x="14" y="36" width="872" height="6" fill="#2a2a2a"/>

  <g font-family="ui-monospace, 'Cascadia Code', Consolas, monospace" font-size="11.5">
    <text x="40" y="70" fill="#6a9955"># exercise 1 — find the market price</text>
    <text x="40" y="90" fill="#d4d4d4">prices = res.prices</text>
    <text x="40" y="110" fill="#d4d4d4">|</text>
    <text x="52" y="110" fill="#5a5a5a">prices.mean().round(2)   &#8592; grey ghost text: this is what you are switching off</text>
  </g>

  <!-- popup menu -->
  <rect x="576" y="128" width="272" height="126" rx="6" fill="#252526" stroke="#454545"/>
  <g font-size="12.5">
    <text x="592" y="152" fill="#dcdcdc">Snooze Completions</text>
    <rect x="578" y="160" width="268" height="24" fill="#04395e"/>
    <text x="592" y="177" fill="#ffffff" font-weight="600">Disable Completions</text>
    <text x="592" y="202" fill="#dcdcdc">Configure Code Completions...</text>
    <line x1="578" y1="212" x2="846" y2="212" stroke="#3c3c3c"/>
    <text x="592" y="232" fill="#dcdcdc">Open Chat</text>
    <text x="592" y="250" fill="#dcdcdc">Settings</text>
  </g>
  <path d="M812 254 l10 12 l10 -12 z" fill="#252526" stroke="#454545"/>

  <!-- status bar -->
  <rect x="14" y="264" width="872" height="32" fill="#181818"/>
  <rect x="14" y="286" width="872" height="10" fill="#181818"/>
  <line x1="14" y1="264" x2="886" y2="264" stroke="#2b2b2b"/>
  <text x="34" y="284" font-size="11.5" fill="#cccccc">main</text>
  <text x="600" y="284" font-size="11.5" fill="#cccccc">Ln 3, Col 1</text>
  <text x="690" y="284" font-size="11.5" fill="#cccccc">UTF-8</text>
  <text x="750" y="284" font-size="11.5" fill="#cccccc">EE2026</text>
  <g stroke="#ffffff" stroke-width="1.3" fill="none">
    <rect x="812" y="272" width="20" height="13" rx="6"/>
    <path d="M812 276 q-4 -6 2 -8 M832 276 q4 -6 -2 -8"/>
  </g>
  <circle cx="818" cy="279" r="1.6" fill="#ffffff" stroke="none"/>
  <circle cx="826" cy="279" r="1.6" fill="#ffffff" stroke="none"/>

  <circle cx="866" cy="279" r="13" fill="#f0a500"/>
  <text x="866" y="284" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text>
  <circle cx="560" cy="172" r="13" fill="#f0a500"/>
  <text x="560" y="177" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">2</text>

  <!-- after state -->
  <text x="16" y="336" font-size="13" fill="#8ec98e" font-weight="600">Done correctly, the icon changes:</text>
  <rect x="224" y="318" width="250" height="26" rx="4" fill="#181818" stroke="#2b2b2b"/>
  <g stroke="#8a8a8a" stroke-width="1.3" fill="none">
    <rect x="240" y="325" width="20" height="13" rx="6"/>
    <path d="M240 329 q-4 -6 2 -8 M260 329 q4 -6 -2 -8"/>
  </g>
  <circle cx="246" cy="332" r="1.5" fill="#8a8a8a"/>
  <circle cx="254" cy="332" r="1.5" fill="#8a8a8a"/>
  <path d="M236 342 l28 -20" stroke="#e08b8b" stroke-width="1.8" fill="none"/>
  <text x="276" y="336" font-size="11.5" fill="#8a8a8a">Completions disabled</text>
  <circle cx="494" cy="331" r="13" fill="#f0a500"/>
  <text x="494" y="336" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">3</text>

  <text x="16" y="382" font-size="13.5" fill="#e6e6e6"><tspan fill="#f0a500" font-weight="700">1</tspan>  Click the Copilot icon in the status bar, bottom right.</text>
  <text x="16" y="404" font-size="13.5" fill="#e6e6e6"><tspan fill="#f0a500" font-weight="700">2</tspan>  <tspan fill="#ffffff">Disable Completions.</tspan> Chat is untouched — the course assistant keeps working exactly as before.</text>
  <text x="16" y="426" font-size="13.5" fill="#e6e6e6"><tspan fill="#f0a500" font-weight="700">3</tspan>  The icon picks up a line through it. That is how you know, and how you check again next week.</text>
  <text x="16" y="452" font-size="12.5" fill="#8f8f8f">Menu wording moves around between versions. If yours reads differently, the entry you want is the one about <tspan font-style="italic">completions</tspan>, never the one about chat.</text>
</svg>
