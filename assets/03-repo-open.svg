<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="ui-sans-serif, 'Segoe UI', system-ui, sans-serif">
  <title>The course repository open in VS Code</title>
  <desc>The Explorer showing the cloned repository: a .claude folder containing skills, the notes and slides folders, and the markdown files at the root including CLAUDE.md.</desc>

  <rect x="0" y="0" width="900" height="600" rx="10" fill="#0b0b0b"/>
  <rect x="14" y="14" width="872" height="452" rx="8" fill="#1f1f1f" stroke="#3a3a3a"/>
  <rect x="14" y="14" width="872" height="32" rx="8" fill="#181818"/>
  <rect x="14" y="36" width="872" height="10" fill="#181818"/>
  <text x="450" y="35" font-size="12" fill="#9d9d9d" text-anchor="middle">README.md — EnergyEconomics — Visual Studio Code</text>
  <line x1="14" y1="46" x2="886" y2="46" stroke="#2b2b2b"/>

  <rect x="14" y="46" width="48" height="388" fill="#181818"/>
  <line x1="62" y1="46" x2="62" y2="434" stroke="#2b2b2b"/>
  <rect x="14" y="60" width="2" height="28" fill="#e0e0e0"/>
  <g stroke="#e0e0e0" stroke-width="1.4" fill="none"><path d="M30 66 h12 l6 6 v14 h-18 z"/></g>
  <g stroke="#7d7d7d" stroke-width="1.4" fill="none">
    <circle cx="35" cy="110" r="6"/><path d="M40 115 l6 6"/>
    <circle cx="31" cy="148" r="4"/><circle cx="43" cy="140" r="4"/><circle cx="43" cy="160" r="4"/>
    <path d="M31 152 v4 q0 4 6 4 h2"/><path d="M43 144 v12"/>
    <path d="M30 186 l14 8 -14 8 z"/>
    <rect x="29" y="228" width="9" height="9"/><rect x="41" y="228" width="9" height="9"/><rect x="29" y="240" width="9" height="9"/>
  </g>

  <!-- explorer -->
  <rect x="62" y="46" width="268" height="388" fill="#181818"/>
  <text x="78" y="70" font-size="11" fill="#bbbbbb" letter-spacing="1.2">EXPLORER</text>
  <text x="78" y="96" font-size="11.5" fill="#cccccc" font-weight="700" letter-spacing="0.6">ENERGYECONOMICS</text>

  <g font-size="12.5" fill="#cccccc">
    <text x="90" y="120" fill="#8a8a8a">&#9660;</text><text x="106" y="120" fill="#dcb67a">.claude</text>
    <text x="112" y="142" fill="#8a8a8a">&#9660;</text><text x="128" y="142" fill="#dcb67a">skills</text>
    <text x="150" y="164" fill="#c8c8c8">check-my-reasoning</text>
    <text x="150" y="184" fill="#c8c8c8">debug-my-setup</text>
    <text x="150" y="204" fill="#c8c8c8">exam-prep</text>
    <text x="150" y="224" fill="#c8c8c8">exercise-coach</text>
    <text x="150" y="244" fill="#c8c8c8">hint</text>
    <text x="150" y="264" fill="#c8c8c8">model-explainer</text>
    <text x="90" y="288" fill="#8a8a8a">&#9654;</text><text x="106" y="288" fill="#dcb67a">notes</text>
    <text x="90" y="310" fill="#8a8a8a">&#9654;</text><text x="106" y="310" fill="#dcb67a">slides</text>
    <text x="106" y="332">AI-POLICY.md</text>
    <text x="106" y="354" fill="#ffffff" font-weight="600">CLAUDE.md</text>
    <text x="106" y="376">CURRICULUM.md</text>
    <text x="106" y="398">environment.yml</text>
    <text x="106" y="420">INSTALL.md</text>
  </g>
  <rect x="62" y="342" width="268" height="20" fill="#2a2d2e"/>
  <text x="106" y="356" font-size="12.5" fill="#ffffff" font-weight="600">CLAUDE.md</text>

  <!-- editor -->
  <rect x="330" y="46" width="556" height="34" fill="#181818"/>
  <rect x="330" y="46" width="116" height="34" fill="#1f1f1f"/>
  <rect x="330" y="46" width="116" height="2" fill="#0078d4"/>
  <text x="346" y="68" font-size="12" fill="#cccccc">README.md</text>
  <line x1="330" y1="80" x2="886" y2="80" stroke="#2b2b2b"/>
  <text x="356" y="112" font-size="16" fill="#e6e6e6" font-weight="700">Energy Economics of the Green Transition</text>
  <text x="356" y="140" font-size="12.5" fill="#9d9d9d">Course material for the MSc elective at the University of</text>
  <text x="356" y="158" font-size="12.5" fill="#9d9d9d">Copenhagen.</text>
  <text x="356" y="192" font-size="13" fill="#e6e6e6" font-weight="600">The course assistant</text>
  <text x="356" y="216" font-size="12.5" fill="#9d9d9d">This repository ships an AI teaching assistant...</text>
  <g font-size="12.5" fill="#9d9d9d">
    <text x="356" y="248">/hint</text><text x="470" y="248">One nudge on the problem you are stuck on</text>
    <text x="356" y="270">/exercise-coach</text><text x="470" y="270">Work through a problem you are stuck on</text>
    <text x="356" y="292">/model-explainer</text><text x="470" y="292">What a piece of model code means</text>
  </g>

  <!-- status bar -->
  <rect x="14" y="434" width="872" height="32" fill="#181818"/>
  <rect x="14" y="456" width="872" height="10" fill="#181818"/>
  <line x1="14" y1="434" x2="886" y2="434" stroke="#2b2b2b"/>
  <g stroke="#cccccc" stroke-width="1.2" fill="none">
    <circle cx="34" cy="444" r="2.6"/><circle cx="34" cy="456" r="2.6"/><circle cx="44" cy="444" r="2.6"/>
    <path d="M34 447 v6"/><path d="M44 447 v2 q0 4 -6 4"/>
  </g>
  <text x="52" y="454" font-size="11.5" fill="#cccccc">main</text>
  <text x="110" y="454" font-size="11.5" fill="#cccccc">0 &#8595;  0 &#8593;</text>
  <text x="790" y="454" font-size="11.5" fill="#cccccc">Markdown</text>

  <!-- callouts -->
  <circle cx="300" cy="92" r="13" fill="#f0a500"/>
  <text x="300" y="97" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">1</text>
  <circle cx="300" cy="352" r="13" fill="#f0a500"/>
  <text x="300" y="357" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">2</text>
  <circle cx="300" cy="138" r="13" fill="#f0a500"/>
  <text x="300" y="143" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">3</text>
  <circle cx="196" cy="450" r="13" fill="#f0a500"/>
  <text x="196" y="455" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">4</text>

  <text x="16" y="500" font-size="13.5" fill="#e6e6e6"><tspan fill="#f0a500" font-weight="700">1</tspan>  The repository name at the top of the Explorer. If you see it, the folder is open and you are done with setup.</text>
  <text x="16" y="522" font-size="13.5" fill="#e6e6e6"><tspan fill="#f0a500" font-weight="700">2</tspan>  <tspan font-family="ui-monospace, Consolas, monospace" fill="#9cdcfe">CLAUDE.md</tspan> — the assistant's instructions. It reads this by itself. You never open it.</text>
  <text x="16" y="544" font-size="13.5" fill="#e6e6e6"><tspan fill="#f0a500" font-weight="700">3</tspan>  <tspan font-family="ui-monospace, Consolas, monospace" fill="#9cdcfe">.claude/skills/</tspan> — one folder per slash command. This is where <tspan font-family="ui-monospace, Consolas, monospace" fill="#9cdcfe">/hint</tspan> and the rest come from.</text>
  <text x="16" y="566" font-size="13.5" fill="#e6e6e6"><tspan fill="#f0a500" font-weight="700">4</tspan>  The branch name in the status bar means git is connected. Clicking the arrows next to it is the same as <tspan font-family="ui-monospace, Consolas, monospace" fill="#9cdcfe">git pull</tspan>.</text>
  <text x="16" y="590" font-size="12.5" fill="#8f8f8f">A folder starting with a dot is hidden by some file managers. VS Code shows it. If you cannot see <tspan font-family="ui-monospace, Consolas, monospace">.claude</tspan>, you are not in the repository root.</text>
</svg>
